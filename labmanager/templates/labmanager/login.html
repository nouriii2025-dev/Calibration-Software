{% extends "labmanager/base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="card" style="max-width:380px;margin:2rem auto;">
    <h2>Log in</h2>
    <form method="post">
        {% csrf_token %}
        <label>Username</label>
        {{ form.username }}
        <label>Password</label>
        {{ form.password }}
        {% if form.errors %}
            <p style="color:#b3261e;font-size:0.85rem;margin-top:0.75rem;">Invalid username or password.</p>
        {% endif %}
        <button class="btn" style="margin-top:1.2rem;width:100%;" type="submit">Log in</button>
    </form>
    <p class="muted" style="margin-top:1rem;">No account? <a href="{% url 'signup' %}">Sign up</a></p>
</div>
{% endblock %}
